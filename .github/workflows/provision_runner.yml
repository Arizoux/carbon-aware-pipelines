name: Carbon-Aware Spatio-Temporal Pipeline

on:
  workflow_dispatch:

jobs:
  evaluate_grid:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.algo.outputs.should_run }}
      region: ${{ steps.algo.outputs.region }}
      machine_type: ${{ steps.algo.outputs.machine_type }}
      provisioning_model: ${{ steps.algo.outputs.provisioning_model }}
      workload: ${{ steps.algo.outputs.workload }}
      runner_name: ${{ steps.algo.outputs.runner_name }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Cache Scheduler State
        uses: actions/cache@v3
        with:
          path: plan.json
          key: carbon-plan-${{ github.run_id }}-${{ github.run_number }}
          restore-keys: |
            carbon-plan-

      # 2. Run the Python Script
      - name: Run Carbon Scheduler Strategy
        id: algo
        env:
          ELECTRICITY_MAPS_API: ${{ secrets.ELECTRICITY_MAPS_API }}
        run: python main.py

  provision_and_test:
    name: Terraform & Build
    needs: evaluate_grid
    if: needs.evaluate_grid.outputs.should_run == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GPC_SA_KEY }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      # 3. Create Ephemeral SSH Key
      - name: Generate SSH Key
        run: |
          ssh-keygen -t rsa -b 4096 -f ~/.ssh/id_rsa -N ""
          echo "SSH_PUB_KEY=$(cat ~/.ssh/id_rsa.pub)" >> $GITHUB_ENV

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Terraform Apply (Provision VM)
        working-directory: ./terraform
        env:
          TF_VAR_gcp_region: ${{ needs.evaluate_grid.outputs.region }}
          TF_VAR_gcp_project_id: ${{ secrets.GPC_PROJECT_ID }}
          TF_VAR_ssh_pub_key: ${{ env.SSH_PUB_KEY }}
          TF_VAR_gcp_machine_type: ${{ needs.evaluate_grid.outputs.machine_type }}
          TF_VAR_gcp_provisioning_model: ${{ needs.evaluate_grid.outputs.provisioning_model }}
          TF_VAR_runner_name: ${{ needs.evaluate_grid.outputs.runner_name }}
        run: terraform apply -auto-approve

      - name: Run CI/CD Workload
        run: |
            VM_IP=$(terraform -chdir=./terraform output -raw vm_ip)
            TARGET_WORKLOAD="${{ needs.evaluate_grid.outputs.workload }}"
            
            echo "Waiting for SSH on $VM_IP..."
            while ! nc -z $VM_IP 22; do sleep 5; done
            
            # SSH-Optionen definieren, damit sie für den Check bereitstehen
            SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/id_rsa"
            
            echo "Waiting for GCP startup script to finish installing Docker..."
            # FIXED: Wartet jetzt auf unseren Custom-Marker
            while ! ssh $SSH_OPTS runner@$VM_IP "test -f /tmp/startup_finished" >/dev/null 2>&1; do
              echo "Dependencies are still installing... retrying in 10 seconds."
              sleep 10
            done
            
            scp $SSH_OPTS -r ./* runner@$VM_IP:/home/runner/
            
            ssh $SSH_OPTS runner@$VM_IP "chmod +x build.sh && ./build.sh $TARGET_WORKLOAD"

      - name: Terraform Destroy
        if: always()
        working-directory: ./terraform
        env:
          TF_VAR_gcp_region: ${{ needs.evaluate_grid.outputs.region }}
          TF_VAR_gcp_project_id: ${{ secrets.GPC_PROJECT_ID }}
          TF_VAR_ssh_pub_key: ${{ env.SSH_PUB_KEY }}
          TF_VAR_gcp_machine_type: ${{ needs.evaluate_grid.outputs.machine_type }}
          TF_VAR_gcp_provisioning_model: ${{ needs.evaluate_grid.outputs.provisioning_model }}
          TF_VAR_runner_name: ${{ needs.evaluate_grid.outputs.runner_name }}
        run: terraform destroy -auto-approve